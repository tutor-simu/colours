<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Учим Цвета</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", cursive, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #ffffff;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Full Screen Main Container with Thick Border */
      .color-container {
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        border: 28px solid #d93d3d; /* Prominent thick frame */
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: border-color 0.4s ease;
      }

      /* 2x2 Grid Spanning Entire Page */
      .items-grid {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 16px;
        padding: 16px;
      }

      .item {
        border: 6px solid #d93d3d;
        border-radius: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        background-color: #ffffff;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.03);
        transition:
          transform 0.1s ease-in-out,
          border-color 0.4s ease,
          box-shadow 0.4s ease;
      }

      .item:active {
        transform: scale(0.97);
      }

      /* Base emoji scaling */
      .item span.emoji {
        font-size: min(30vw, 30vh);
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Center Text Label */
      .central-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #ffffff;
        color: #d93d3d;
        font-size: clamp(2.8rem, 9vw, 5.5rem);
        font-weight: 900;
        text-transform: uppercase;
        padding: 12px 36px;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        pointer-events: none;
        z-index: 10;
        text-align: center;
        white-space: nowrap;
        transition: color 0.4s ease;
      }

      /* Top Prompt Bar for Quiz Mode */
      .quiz-banner {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #ffffff;
        color: #1e293b;
        font-size: clamp(1.4rem, 4.5vw, 2.2rem);
        font-weight: 900;
        padding: 12px 32px;
        border-radius: 36px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        z-index: 12;
        display: none;
        white-space: nowrap;
      }

      /* High-Visibility Next Arrow Button */
      .next-arrow-btn {
        position: absolute;
        bottom: 24px;
        right: 24px;
        background: #d93d3d;
        color: #ffffff;
        border: 4px solid #ffffff;
        border-radius: 50%;
        width: 76px;
        height: 76px;
        font-size: 2.8rem;
        cursor: pointer;
        box-shadow:
          0 6px 0 rgba(0, 0, 0, 0.2),
          0 8px 16px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transition:
          background-color 0.4s ease,
          transform 0.1s ease;
      }

      .next-arrow-btn:active {
        transform: translateY(4px);
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.2),
          0 4px 8px rgba(0, 0, 0, 0.25);
      }

      /* MOBILE OPTIMIZATIONS */
      @media (max-width: 768px) {
        .color-container {
          border-width: 18px; /* Thick and clear frame on phone */
        }

        .items-grid {
          padding-top: 72px;
          padding-bottom: 76px;
          padding-left: 10px;
          padding-right: 10px;
          gap: 10px;
        }

        .item {
          border-width: 4px;
          border-radius: 20px;
        }

        .item span.emoji {
          font-size: min(28vw, 28vh);
        }

        .central-text {
          font-size: clamp(2.2rem, 8.5vw, 3.8rem);
          padding: 8px 24px;
          border-radius: 18px;
        }

        .quiz-banner {
          top: 12px;
          font-size: clamp(1.2rem, 5vw, 1.7rem);
          padding: 8px 22px;
        }

        .next-arrow-btn {
          width: 64px;
          height: 64px;
          font-size: 2.2rem;
          bottom: 16px;
          right: 16px;
        }
      }

      /* Shake animation for wrong selection */
      .shake {
        animation: shakeAnim 0.4s ease;
      }

      @keyframes shakeAnim {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-10px);
        }
        40% {
          transform: translateX(10px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }

      /* Canvas overlay for Confetti */
      #confetti-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div class="color-container" id="main-frame">
      <canvas id="confetti-canvas"></canvas>

      <!-- Quiz Question Header -->
      <div class="quiz-banner" id="quiz-banner">Где красный предмет?</div>

      <!-- Central Word Label -->
      <div class="central-text" id="central-text">КРАСНЫЙ</div>

      <!-- 4 Objects Grid -->
      <div class="items-grid" id="items-grid">
        <!-- Generated dynamically -->
      </div>

      <!-- Next Arrow -->
      <button class="next-arrow-btn" id="next-btn" onclick="handleNextClick()">➔</button>
    </div>
    <script>
      const colorsData = [
        {
          ru: "Красный",
          ruForm: "красный",
          hex: "#d93d3d",
          objects: [
            { emoji: "🍎", name: "Яблоко" },
            { emoji: "🚗", name: "Машина" },
            { emoji: "🌹", name: "Роза" },
            { emoji: "🚒", name: "Пожарка" },
          ],
        },
        {
          ru: "Синий",
          ruForm: "синий",
          hex: "#2563eb",
          objects: [
            { emoji: "🐟", name: "Рыба" },
            { emoji: "🐋", name: "Кит" },
            { emoji: "🧢", name: "Кепка" },
            { emoji: "👖", name: "Джинсы" },
          ],
        },
        {
          ru: "Зелёный",
          ruForm: "зелёный",
          hex: "#22c55e",
          objects: [
            { emoji: "🌳", name: "Дерево" },
            { emoji: "🥒", name: "Огурец" },
            { emoji: "🍃", name: "Листик" },
            { emoji: "🥦", name: "Брокколи" },
          ],
        },
        {
          ru: "Жёлтый",
          ruForm: "жёлтый",
          hex: "#eab308",
          objects: [
            { emoji: "🍌", name: "Банан" },
            { emoji: "☀️", name: "Солнце" },
            { emoji: "🐥", name: "Цыплёнок" },
            { emoji: "🍋", name: "Лимон" },
          ],
        },
      ];

      let gameState = "LEARN"; // "LEARN" or "QUIZ"
      let currentIndex = 0;
      let quizTargetObject = null;
      let isTransitioning = false;
      let speechTimer = null;

      function speakText(text, callback) {
        if (speechTimer) {
          clearTimeout(speechTimer);
          speechTimer = null;
        }

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();

          // Append punctuation for full/clear word output on mobile browsers
          const formattedText =
            text.trim().endsWith(".") || text.trim().endsWith("?") || text.trim().endsWith("!") ? text : text + ".";

          const utterance = new SpeechSynthesisUtterance(formattedText);
          utterance.lang = "ru-RU";
          utterance.rate = 0.8;
          utterance.pitch = 1.1;
          if (callback) utterance.onend = callback;
          window.speechSynthesis.speak(utterance);
        } else if (callback) {
          callback();
        }
      }

      function playWrongSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const playNote = (freq, startTime, duration) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };
          playNote(260, ctx.currentTime, 0.12);
          playNote(220, ctx.currentTime + 0.12, 0.18);
        } catch (e) {}
      }

      function playCorrectSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + index * 0.08;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.25, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
          });
        } catch (e) {}
      }

      function loadLearnCard(index) {
        isTransitioning = false;
        const data = colorsData[index];
        const frame = document.getElementById("main-frame");
        const centralText = document.getElementById("central-text");
        const banner = document.getElementById("quiz-banner");
        const arrowBtn = document.getElementById("next-btn");

        frame.style.borderColor = data.hex;
        centralText.style.color = data.hex;
        centralText.textContent = data.ru;
        centralText.style.display = "block";
        banner.style.display = "none";

        arrowBtn.style.backgroundColor = data.hex;
        arrowBtn.style.display = "flex";

        const grid = document.getElementById("items-grid");
        grid.innerHTML = "";

        data.objects.forEach((obj) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          itemDiv.style.borderColor = data.hex;
          itemDiv.innerHTML = `<span class="emoji">${obj.emoji}</span>`;
          itemDiv.onclick = () => speakText(obj.name);
          grid.appendChild(itemDiv);
        });

        // Pronounces the color ONCE
        speakText(data.ru);
      }

      function loadQuizCard(index) {
        isTransitioning = false;
        const targetColor = colorsData[index];
        const frame = document.getElementById("main-frame");
        const centralText = document.getElementById("central-text");
        const banner = document.getElementById("quiz-banner");
        const arrowBtn = document.getElementById("next-btn");

        frame.style.borderColor = targetColor.hex;
        centralText.style.display = "none";
        banner.style.display = "block";
        banner.textContent = `Где ${targetColor.ruForm} предмет?`;

        arrowBtn.style.display = "none";

        speakText(`Где ${targetColor.ruForm} предмет?`);

        quizTargetObject = targetColor.objects[Math.floor(Math.random() * targetColor.objects.length)];

        const otherColors = colorsData.filter((_, i) => i !== index);
        const wrongObjs = otherColors.map((c) => c.objects[Math.floor(Math.random() * c.objects.length)]);

        const allChoices = [quizTargetObject, ...wrongObjs].sort(() => Math.random() - 0.5);

        const grid = document.getElementById("items-grid");
        grid.innerHTML = "";

        allChoices.forEach((obj) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          itemDiv.style.borderColor = targetColor.hex;
          itemDiv.innerHTML = `<span class="emoji">${obj.emoji}</span>`;
          itemDiv.onclick = () => handleQuizChoice(obj, itemDiv, targetColor);
          grid.appendChild(itemDiv);
        });
      }

      function handleQuizChoice(selectedObj, elem, targetColor) {
        if (isTransitioning) return;

        if (selectedObj.name === quizTargetObject.name) {
          isTransitioning = true;
          triggerConfetti();
          playCorrectSound();

          speakText("Правильно! Молодец!", () => {
            setTimeout(() => {
              advanceQuiz();
            }, 300);
          });
        } else {
          playWrongSound();
          elem.classList.add("shake");
          setTimeout(() => elem.classList.remove("shake"), 400);
        }
      }

      function advanceQuiz() {
        currentIndex++;
        if (currentIndex < colorsData.length) {
          loadQuizCard(currentIndex);
        } else {
          speakText("Отлично! Ты прошёл всё задание!", () => {
            setTimeout(() => {
              window.location.href = "part2.html";
            }, 500);
          });
        }
      }

      function handleNextClick() {
        if (isTransitioning) return;

        isTransitioning = true;
        setTimeout(() => {
          isTransitioning = false;
        }, 300);

        if (gameState === "LEARN") {
          currentIndex++;
          if (currentIndex < colorsData.length) {
            loadLearnCard(currentIndex);
          } else {
            gameState = "QUIZ";
            currentIndex = 0;
            loadQuizCard(currentIndex);
          }
        }
      }

      function triggerConfetti() {
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        const particles = [];
        const colors = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#ec4899"];

        for (let i = 0; i < 40; i++) {
          particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.7) * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
          });
        }

        let frames = 0;
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });

          frames++;
          if (frames < 40) requestAnimationFrame(animate);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        animate();
      }

      window.addEventListener("load", () => {
        loadLearnCard(0);
      });
    </script>
  </body>
</html>
