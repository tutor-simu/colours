<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Учим Цвета</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", cursive, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #d93d3d; /* Dynamic active color */
        transition: background-color 0.4s ease;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Entrance / Welcome Overlay Screen */
      .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
      }

      .welcome-title {
        color: #d93d3d;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 900;
        text-shadow: 2px 2px 0px #ffffff;
        margin-bottom: 12px;
      }

      .welcome-subtitle {
        color: #475569;
        font-size: clamp(1.2rem, 4vw, 2rem);
        font-weight: 700;
        margin-bottom: 32px;
      }

      .start-btn {
        background-color: #22c55e;
        color: #ffffff;
        border: 4px solid #ffffff;
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        font-weight: 900;
        padding: 16px 48px;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        transition:
          transform 0.1s ease,
          background-color 0.2s ease;
      }

      .start-btn:active {
        transform: scale(0.95);
      }

      /* Main Full Screen Container */
      .color-container {
        width: 100vw;
        height: 100vh;
        background-color: #d93d3d;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px; /* 30px border from edges */
        transition: background-color 0.4s ease;
      }

      .inner-white-board {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        border-radius: 28px;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 2x2 Grid Spanning Page */
      .items-grid {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 16px;
        padding: 16px;
      }

      .item {
        border: 6px solid #d93d3d;
        border-radius: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        background-color: #ffffff;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.03);
        transition:
          transform 0.1s ease-in-out,
          border-color 0.4s ease;
      }

      .item:active {
        transform: scale(0.97);
      }

      /* Base emoji scaling */
      .item span.emoji {
        font-size: min(28vw, 22vh);
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Center Text Label */
      .central-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #ffffff;
        color: #d93d3d;
        font-size: clamp(2.4rem, 8vw, 5rem);
        font-weight: 900;
        text-transform: uppercase;
        padding: 12px 36px;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        pointer-events: none;
        z-index: 10;
        text-align: center;
        white-space: nowrap;
        transition: color 0.4s ease;
      }

      /* Top Prompt Bar for Quiz Mode */
      .quiz-banner {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #ffffff;
        color: #1e293b;
        font-size: clamp(1.4rem, 4.5vw, 2.2rem);
        font-weight: 900;
        padding: 12px 32px;
        border-radius: 36px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        z-index: 12;
        display: none;
        white-space: nowrap;
      }

      /* Circular Next Arrow Button */
      .next-arrow-btn {
        position: absolute;
        bottom: 24px;
        right: 24px;
        background: #d93d3d;
        color: #ffffff;
        border: 4px solid #ffffff;
        border-radius: 50%;
        width: 76px;
        height: 76px;
        font-size: 2.8rem;
        cursor: pointer;
        box-shadow:
          0 6px 0 rgba(0, 0, 0, 0.2),
          0 8px 16px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transition:
          background-color 0.4s ease,
          transform 0.1s ease;
      }

      .next-arrow-btn:active {
        transform: translateY(4px);
      }

      /* STRICT MOBILE PHONE ADJUSTMENTS */
      @media (max-width: 768px) {
        .color-container {
          padding: 30px !important; /* Strict 30px outer frame padding from edges */
        }

        .inner-white-board {
          border-radius: 20px;
        }

        .items-grid {
          padding: 10px;
          gap: 10px;
        }

        .item {
          border-width: 4px;
          border-radius: 18px;
        }

        .item span.emoji {
          font-size: min(24vw, 18vh);
        }

        .central-text {
          font-size: clamp(1.8rem, 7.5vw, 3.2rem);
          padding: 8px 20px;
          border-radius: 16px;
        }

        .quiz-banner {
          top: 10px;
          font-size: clamp(1rem, 4.2vw, 1.4rem);
          padding: 6px 16px;
        }

        .next-arrow-btn {
          width: 60px;
          height: 60px;
          font-size: 2rem;
          bottom: 12px;
          right: 12px;
        }
      }

      /* Shake animation for wrong selection */
      .shake {
        animation: shakeAnim 0.4s ease;
      }

      @keyframes shakeAnim {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-10px);
        }
        40% {
          transform: translateX(10px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }

      /* Canvas overlay for Confetti */
      #confetti-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <!-- Welcome Entrance Screen -->
    <div class="welcome-overlay" id="welcome-screen">
      <div class="welcome-title">Добро пожаловать!</div>
      <div class="welcome-subtitle">Давай учить цвета вместе!</div>
      <button class="start-btn" onclick="startGame()">Начать ➔</button>
    </div>

    <!-- Main Game Frame -->
    <div class="color-container" id="main-frame">
      <div class="inner-white-board">
        <canvas id="confetti-canvas"></canvas>

        <!-- Quiz Question Header -->
        <div class="quiz-banner" id="quiz-banner">Где красный предмет?</div>

        <!-- Central Word Label -->
        <div class="central-text" id="central-text">КРАСНЫЙ</div>

        <!-- 4 Objects Grid -->
        <div class="items-grid" id="items-grid">
          <!-- Generated dynamically -->
        </div>

        <!-- Next Arrow -->
        <button class="next-arrow-btn" id="next-btn" onclick="handleNextClick()">➔</button>
      </div>
    </div>

    <script>
      const colorsData = [
        {
          ru: "Красный",
          ruForm: "красный",
          hex: "#d93d3d",
          objects: [
            { emoji: "🍎", name: "Яблоко" },
            { emoji: "🚗", name: "Машина" },
            { emoji: "🌹", name: "Роза" },
            { emoji: "🚒", name: "Пожарка" },
          ],
        },
        {
          ru: "Синий",
          ruForm: "синий",
          hex: "#2563eb",
          objects: [
            { emoji: "🐟", name: "Рыба" },
            { emoji: "🐋", name: "Кит" },
            { emoji: "🧢", name: "Кепка" },
            { emoji: "👖", name: "Джинсы" },
          ],
        },
        {
          ru: "Зелёный",
          ruForm: "зелёный",
          hex: "#22c55e",
          objects: [
            { emoji: "🌳", name: "Дерево" },
            { emoji: "🥒", name: "Огурец" },
            { emoji: "🍃", name: "Листик" },
            { emoji: "🥦", name: "Брокколи" },
          ],
        },
        {
          ru: "Жёлтый",
          ruForm: "жёлтый",
          hex: "#eab308",
          objects: [
            { emoji: "🍌", name: "Банан" },
            { emoji: "☀️", name: "Солнце" },
            { emoji: "🐥", name: "Цыплёнок" },
            { emoji: "🍋", name: "Лимон" },
          ],
        },
      ];

      let gameState = "LEARN"; // "LEARN" or "QUIZ"
      let currentIndex = 0;
      let quizTargetObject = null;
      let isTransitioning = false;
      let speechTimer = null;

      function startGame() {
        document.getElementById("welcome-screen").style.display = "none";
        loadLearnCard(0);
      }

      function speakText(text, callback) {
        if (speechTimer) {
          clearTimeout(speechTimer);
          speechTimer = null;
        }

        let hasCalledCallback = false;
        const safeCallback = () => {
          if (!hasCalledCallback) {
            hasCalledCallback = true;
            if (speechTimer) clearTimeout(speechTimer);
            if (callback) callback();
          }
        };

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();

          const formattedText =
            text.trim().endsWith(".") || text.trim().endsWith("?") || text.trim().endsWith("!") ? text : text + ".";

          const utterance = new SpeechSynthesisUtterance(formattedText);
          utterance.lang = "ru-RU";
          utterance.rate = 0.8;
          utterance.pitch = 1.1;

          utterance.onend = safeCallback;
          utterance.onerror = safeCallback;

          window.speechSynthesis.speak(utterance);

          // Fallback timer in case speech synthesis fails or gets stuck on mobile
          speechTimer = setTimeout(safeCallback, 1500);
        } else {
          safeCallback();
        }
      }

      function playWrongSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const playNote = (freq, startTime, duration) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };
          playNote(260, ctx.currentTime, 0.12);
          playNote(220, ctx.currentTime + 0.12, 0.18);
        } catch (e) {}
      }

      function playCorrectSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + index * 0.08;
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.25, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
          });
        } catch (e) {}
      }

      function loadLearnCard(index) {
        isTransitioning = false;
        const data = colorsData[index];
        const frame = document.getElementById("main-frame");
        const centralText = document.getElementById("central-text");
        const banner = document.getElementById("quiz-banner");
        const arrowBtn = document.getElementById("next-btn");

        document.body.style.backgroundColor = data.hex;
        frame.style.backgroundColor = data.hex;
        centralText.style.color = data.hex;
        centralText.textContent = data.ru;
        centralText.style.display = "block";
        banner.style.display = "none";

        arrowBtn.style.backgroundColor = data.hex;
        arrowBtn.style.display = "flex";

        const grid = document.getElementById("items-grid");
        grid.innerHTML = "";

        data.objects.forEach((obj) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          itemDiv.style.borderColor = data.hex;
          itemDiv.innerHTML = `<span class="emoji">${obj.emoji}</span>`;
          itemDiv.onclick = () => speakText(obj.name);
          grid.appendChild(itemDiv);
        });

        // Pronounces the color ONCE
        speakText(data.ru);
      }

      function loadQuizCard(index) {
        isTransitioning = false;
        const targetColor = colorsData[index];
        const frame = document.getElementById("main-frame");
        const centralText = document.getElementById("central-text");
        const banner = document.getElementById("quiz-banner");
        const arrowBtn = document.getElementById("next-btn");

        document.body.style.backgroundColor = targetColor.hex;
        frame.style.backgroundColor = targetColor.hex;
        centralText.style.display = "none";
        banner.style.display = "block";
        banner.textContent = `Где ${targetColor.ruForm} предмет?`;

        arrowBtn.style.display = "none";

        speakText(`Где ${targetColor.ruForm} предмет?`);

        quizTargetObject = targetColor.objects[Math.floor(Math.random() * targetColor.objects.length)];

        const otherColors = colorsData.filter((_, i) => i !== index);
        const wrongObjs = otherColors.map((c) => c.objects[Math.floor(Math.random() * c.objects.length)]);

        const allChoices = [quizTargetObject, ...wrongObjs].sort(() => Math.random() - 0.5);

        const grid = document.getElementById("items-grid");
        grid.innerHTML = "";

        allChoices.forEach((obj) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "item";
          itemDiv.style.borderColor = targetColor.hex;
          itemDiv.innerHTML = `<span class="emoji">${obj.emoji}</span>`;
          itemDiv.onclick = () => handleQuizChoice(obj, itemDiv, targetColor);
          grid.appendChild(itemDiv);
        });
      }

      function handleQuizChoice(selectedObj, elem, targetColor) {
        if (isTransitioning) return;

        if (selectedObj.name === quizTargetObject.name) {
          isTransitioning = true;
          triggerConfetti();
          playCorrectSound();

          speakText("Ты угадал!", () => {
            advanceQuiz();
          });
        } else {
          playWrongSound();
          elem.classList.add("shake");
          setTimeout(() => elem.classList.remove("shake"), 400);
        }
      }

      function advanceQuiz() {
        currentIndex++;
        if (currentIndex < colorsData.length) {
          loadQuizCard(currentIndex);
        } else {
          // Immediately trigger redirect after quiz completion
          setTimeout(() => {
            window.location.href = "part2.html";
          }, 600);
        }
      }

      function handleNextClick() {
        if (isTransitioning) return;

        isTransitioning = true;
        setTimeout(() => {
          isTransitioning = false;
        }, 300);

        if (gameState === "LEARN") {
          currentIndex++;
          if (currentIndex < colorsData.length) {
            loadLearnCard(currentIndex);
          } else {
            gameState = "QUIZ";
            currentIndex = 0;
            loadQuizCard(currentIndex);
          }
        }
      }

      function triggerConfetti() {
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        const particles = [];
        const colors = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#ec4899"];

        for (let i = 0; i < 40; i++) {
          particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.7) * 10,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 8 + 4,
          });
        }

        let frames = 0;
        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });

          frames++;
          if (frames < 40) requestAnimationFrame(animate);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        animate();
      }
    </script>
  </body>
</html>
